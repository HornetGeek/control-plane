# Docker Compose for Control Plane API
# Usage: docker-compose up

version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: control-plane-db
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane_password
      # Additional database for Zitadel
      POSTGRES_MULTIPLE_DATABASES: keycloak
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - control-plane-network

  # Keycloak (OIDC Identity Provider) - for development/testing
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: control-plane-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: control_plane
      KC_DB_PASSWORD: control_plane_password
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane-network

  # Control Plane API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-plane-api
    environment:
      # Application
      CONTROL_PLANE_ENV: development
      CONTROL_PLANE_HOST: 0.0.0.0
      CONTROL_PLANE_PORT: 8000
      CONTROL_PLANE_LOG_LEVEL: info

      # Database
      DATABASE_URL: postgresql+asyncpg://control_plane:control_plane_password@postgres:5432/control_plane

      # OIDC / Keycloak - use host gateway IP for Docker-to-Host access
      OIDC_ISSUER: http://host.docker.internal:18080/realms/control-plane
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-control-plane-client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-control-plane-secret}
      OIDC_REDIRECT_URI: http://localhost:8000/v1/auth/callback
      OIDC_SCOPES: openid profile email org_id

      # Application Catalog
      APPLICATIONS__PACS__NAME: PACS
      APPLICATIONS__PACS__URL: https://pacs.example.com/launch
      APPLICATIONS__PACS__STATUS: active
      APPLICATIONS__ERP__NAME: ERP
      APPLICATIONS__ERP__URL: https://erp.example.com/launch
      APPLICATIONS__ERP__STATUS: active
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane-network
    volumes:
      - ./src:/app/src:ro
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro

  # Database migration runner (one-shot)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-plane-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://control_plane:control_plane_password@postgres:5432/control_plane
      # OIDC / Zitadel (required by Settings)
      OIDC_ISSUER: http://localhost:18080/realms/control-plane
      OIDC_CLIENT_ID: control-plane-client
      OIDC_CLIENT_SECRET: control-plane-secret
      OIDC_REDIRECT_URI: http://localhost:8000/v1/auth/callback
      OIDC_SCOPES: openid profile email org_id
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane-network
    volumes:
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        echo 'Migrations completed successfully'
      "
    profiles:
      - migrate

volumes:
  postgres_data:
    driver: local

networks:
  control-plane-network:
    driver: bridge
